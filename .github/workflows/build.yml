name: Build VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npx tsc -p ./

      - name: Run tests
        run: node --test out/test/crypto.test.js out/test/scanner.test.js

      - name: Package VSIX
        run: npx @vscode/vsce package --allow-missing-repository --skip-license --out copilot-config-sync-0.1.${{ github.run_number }}.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-config-sync-vsix
          path: "*.vsix"
          retention-days: 90

      - name: Update release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: "*.vsix"
          make_latest: true
          allow_updates: true
